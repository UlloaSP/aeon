# Static CRT: aeon.exe runs without the Visual C++ Redistributable, so the MSI
# ships one file and never depends on what else is installed.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
