name: Setup Rust
description: Install the toolchain pinned in rust-toolchain.toml and restore the cargo cache.
inputs:
  target:
    description: Extra target triple to install, such as aarch64-pc-windows-msvc. Empty installs only the host target.
    required: false
    default: ""
  cache-key:
    description: Jobs that compile the same thing share a key; jobs that compile different things must not.
    required: false
    default: default
  cache:
    description: Set to "false" for jobs that compile nothing, such as rustfmt.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    # Installed by name from rust-toolchain.toml so every job, and every
    # developer, builds with the same compiler regardless of the runner image.
    - name: Install toolchain
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        channel="$(sed -nE 's/^channel = "(.+)"$/\1/p' rust-toolchain.toml)"
        if [[ -z "$channel" ]]; then
          echo "rust-toolchain.toml has no channel." >&2
          exit 1
        fi
        rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy --no-self-update
        if [[ -n "$TARGET" ]]; then
          rustup target add --toolchain "$channel" "$TARGET"
        fi
        rustc --version

    # Only pushes to main and develop save, so pull requests never evict each
    # other's entries. A pull request can read its base branch's cache, so work
    # branches start from develop's.
    - name: Cache cargo
      if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
