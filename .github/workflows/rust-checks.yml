# Clippy and the test suite on Windows. Called by ci.yml for every change that
# touches Rust, and by release.yml on the exact commit being released.
name: Rust Checks

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to check. Empty checks the triggering commit.
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # One job, not two: Windows minutes cost twice Linux ones, and clippy warms
  # the dependency metadata the test build reuses.
  clippy_test:
    name: Clippy and Test
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: checks

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Includes a real ConPTY round trip (crates/aeon-pty), so this must stay
      # on Windows.
      - name: Test
        run: cargo test --workspace --locked
