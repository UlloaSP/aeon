name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-nightly.*"
  schedule:
    # Daily nightly. Avoid minute zero, when GitHub scheduled jobs are busiest.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel. Stable ships main at the version in Cargo.toml; nightly ships develop."
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - stable

# Nightlies and stables get separate groups so a nightly never blocks a stable.
# Running publishers are never cancelled, and queue: max keeps every pending
# run instead of the default newest-wins single slot, so a queued stable tag
# can never be silently dropped.
concurrency:
  group: release-${{ (github.event_name == 'schedule' || inputs.channel == 'nightly') && 'nightly' || 'stable' }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  # Picks the channel, version, and commit every later job uses. The logic
  # lives in .github/scripts/resolve-release.sh. The PAUSE_NIGHTLY repository
  # variable skips scheduled runs only.
  preflight:
    name: Preflight
    if: github.event_name != 'schedule' || vars.PAUSE_NIGHTLY != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should_release: ${{ steps.resolve.outputs.should_release }}
      channel: ${{ steps.resolve.outputs.channel }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      name: ${{ steps.resolve.outputs.name }}
      previous_tag: ${{ steps.resolve.outputs.previous_tag }}
      is_prerelease: ${{ steps.resolve.outputs.is_prerelease }}
      make_latest: ${{ steps.resolve.outputs.make_latest }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      # Nightlies build develop's tip and manual stables build main's, whatever
      # branch the run was started from. A tag push builds the tag.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ (github.event_name == 'schedule' || inputs.channel == 'nightly') && 'develop' || (github.event_name == 'workflow_dispatch' && 'main' || '') }}
          fetch-depth: 0
          filter: blob:none

      # An explicit `shell: bash` adds pipefail, so a failing script is not
      # hidden behind tee's success.
      - name: Resolve release
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_CHANNEL: ${{ inputs.channel }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: bash .github/scripts/resolve-release.sh | tee -a "$GITHUB_OUTPUT"

  # The same checks CI runs, on the exact commit being shipped.
  quality:
    name: Quality
    needs: preflight
    if: needs.preflight.outputs.should_release == 'true'
    uses: ./.github/workflows/rust-checks.yml
    with:
      ref: ${{ needs.preflight.outputs.ref }}

  build:
    name: Windows ${{ matrix.arch }}
    needs: preflight
    if: needs.preflight.outputs.should_release == 'true'
    strategy:
      fail-fast: true
      matrix:
        arch: [x64, arm64]
    uses: ./.github/workflows/release-windows.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      arch: ${{ matrix.arch }}
      smoke-install: ${{ matrix.arch == 'x64' }}

  publish:
    name: Publish GitHub Release
    needs: [preflight, quality, build]
    if: ${{ !failure() && !cancelled() && needs.preflight.outputs.should_release == 'true' && needs.quality.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-*
          merge-multiple: true
          path: release-assets

      # Written from the exact bytes that get uploaded, never an earlier stage.
      - name: Write checksums
        working-directory: release-assets
        run: |
          shopt -s nullglob
          assets=(*.msi *.zip)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No installers were produced." >&2
            exit 1
          fi
          sha256sum "${assets[@]}" > SHA256SUMS
          cat SHA256SUMS

      # Created as a draft so no one sees a release with half its assets. The
      # last step publishes it, which also creates the tag for nightlies.
      - name: Create draft release
        if: needs.preflight.outputs.previous_tag != ''
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.name }}
          generate_release_notes: true
          previous_tag: ${{ needs.preflight.outputs.previous_tag }}
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          draft: true
          files: |
            release-assets/*.msi
            release-assets/*.zip
            release-assets/SHA256SUMS
          fail_on_unmatched_files: true
          token: ${{ github.token }}

      - name: Create first draft release
        if: needs.preflight.outputs.previous_tag == ''
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.name }}
          generate_release_notes: true
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          draft: true
          files: |
            release-assets/*.msi
            release-assets/*.zip
            release-assets/SHA256SUMS
          fail_on_unmatched_files: true
          token: ${{ github.token }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          MAKE_LATEST: ${{ needs.preflight.outputs.make_latest }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest="$MAKE_LATEST"

      # The feed installed Aeons check for updates (crates/aeon-launcher/src/
      # update.rs): one file per channel on the fixed `update-feed` release.
      # Written last, so it only ever points at a published release. Stable
      # prereleases (rc builds) are not offered to anyone.
      - name: Update the update feed
        if: needs.preflight.outputs.channel == 'nightly' || needs.preflight.outputs.is_prerelease == 'false'
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
          CHANNEL: ${{ needs.preflight.outputs.channel }}
        run: |
          base="https://github.com/$GH_REPO/releases/download/$RELEASE_TAG"
          {
            echo "version $VERSION"
            echo "notes https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG"
            for arch in x64 arm64; do
              file="aeon-$VERSION-windows-$arch.msi"
              sha="$(awk -v f="$file" '$2 == f { print $1 }' SHA256SUMS)"
              if [[ -z "$sha" ]]; then
                echo "No checksum for $file." >&2
                exit 1
              fi
              echo "$arch $base/$file $sha"
            done
          } > "$CHANNEL.txt"
          cat "$CHANNEL.txt"
          # Stable and nightly runs can both get here first; either may create it.
          gh release view update-feed > /dev/null 2>&1             || gh release create update-feed --title "Update feed" --prerelease --latest=false               --notes "What installed copies of Aeon read to find updates. Not a release; nothing to download here."             || gh release view update-feed > /dev/null
          gh release upload update-feed "$CHANNEL.txt" --clobber

  # Nightlies pile up fast. Keep the newest few; stable releases are never touched.
  prune_nightlies:
    name: Prune old nightlies
    needs: [preflight, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.preflight.outputs.channel == 'nightly' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Delete all but the newest 10 nightlies
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP: "10"
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("-nightly\\."))] | sort_by(.createdAt) | reverse | .[env.KEEP | tonumber:] | .[].tagName' \
            | while read -r tag; do
                echo "Deleting $tag"
                gh release delete "$tag" --yes --cleanup-tag
              done
